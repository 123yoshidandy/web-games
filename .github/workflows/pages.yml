name: Pages

# 各ゲームの公開するファイルと、ゲームの一覧のページを _site/ に集めて GitHub Pages に載せる
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ゲームをまたいだ確認（標準の必須の項目は test.yml で見て、公開は止めない）
      - name: Check games
        run: node scripts/check-games.mjs --skip-standards
      # 公開するファイルを _site/ に集める
      - name: Build site
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
