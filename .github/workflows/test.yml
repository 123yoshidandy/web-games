name: Test

# ゲームをまたいだ確認と直下のスクリプトのテストは毎回流し、ゲームと共通の部品のテストは変わったものだけ流す（scripts/changed-games.mjs）
# 公開（pages.yml）とは別に流れ、公開は止めない
on:
  pull_request:
  push:
    branches: [main]

# 同じブランチに新しい push が来たら、古いテストは取りやめて最新だけを流す
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 最後に流れきったテストのコミットを、gh run list で調べる
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ゲームをまたいだ確認と、標準の必須の項目
      - name: Check games
        run: node scripts/check-games.mjs
      # 直下のスクリプトのテスト（一覧のページの検索・決まりの表・画面の検査の判定・テストを流すゲームの選び方）
      - name: Test scripts
        run: node --test "scripts/**/*.test.mjs"
      # BGM のエンジンの写しが、元とそろっているか
      - name: Check BGM engine copies
        run: node packages/sound/scripts/sync.mjs check --all
      # 対局時計の写し（chess・shogi・go・gomoku の clock.js）が、元とそろっているか
      - name: Check clock copies
        run: node packages/clock/scripts/sync.mjs check --all
      # 動きの部品の写しが、元とそろっているか
      - name: Check motion copies
        run: node packages/motion/scripts/sync.mjs check --all
      # シード付きの乱数の写し（random.js）が、元とそろっているか
      - name: Check random copies
        run: node packages/random/scripts/sync.mjs check --all
      # 変わったゲームと共通の部品のテスト
      # push の比べる元は、同じブランチで最後に流れきった（成功か失敗の）テストのコミット
      # github.event.before だと、取りやめになった push の変更を、次の実行が見落とす（取りやめたコミットが比べる元になるため）
      # 失敗も数えるのは、失敗が続いても比べる範囲が広がり続けないように（失敗は、その実行で一度知らせてある）
      - name: Test changed games
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE=$(gh run list -R "$GITHUB_REPOSITORY" --workflow test.yml --branch "$BRANCH" --event push --status completed \
              --limit 20 --json conclusion,headSha \
              --jq 'map(select(.conclusion == "success" or .conclusion == "failure"))[0].headSha // empty' || true)
            echo "比べる元: ${BASE:-なし}（最後に流れきったテスト）"
          fi
          # 初めてのプッシュなど、比べる元がないときは全部流す
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            targets=$(ls -d packages/*/ games/*/ | sed 's|/$||')
          else
            targets=$(node scripts/changed-games.mjs "$BASE")
          fi
          if [ -z "$targets" ]; then
            echo "テストを流すゲームはありません"
            exit 0
          fi
          failed=""
          for target in $targets; do
            echo "::group::$target"
            npm test --if-present -w "$target" || failed="$failed $target"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "失敗:$failed"
            exit 1
          fi
