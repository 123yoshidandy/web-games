name: テスト

# ゲームをまたいだ確認と直下のスクリプトのテストは毎回流し、ゲームと共通の部品のテストは変わったものだけ流す（scripts/changed-games.mjs）
# 公開（pages.yml）とは別に流れ、公開は止めない
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ゲームをまたいだ確認と、標準の必須の項目
        run: node scripts/check-games.mjs
      - name: 直下のスクリプトのテスト（一覧のページの検索・決まりの表・画面の検査の判定・テストを流すゲームの選び方）
        run: node --test "scripts/**/*.test.mjs"
      - name: BGM のエンジンの写し
        run: node packages/sound/scripts/sync.mjs check --all
      - name: 変わったゲームのテスト
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 初めてのプッシュなど、比べる元がないときは全部流す
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            targets=$(ls -d packages/*/ games/*/ | sed 's|/$||')
          else
            targets=$(node scripts/changed-games.mjs "$BASE")
          fi
          if [ -z "$targets" ]; then
            echo "テストを流すゲームはありません"
            exit 0
          fi
          failed=""
          for target in $targets; do
            echo "::group::$target"
            npm test --if-present -w "$target" || failed="$failed $target"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "失敗:$failed"
            exit 1
          fi
