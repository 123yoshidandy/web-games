# まとめたオンライン対戦のサーバー（スタック web-games-online）を、main への push で自動デプロイする（docs/server-merge.md）
# netplay-kit の template/deploy-server.yml をもとに、次を変えた
# - 動く条件：サーバーと、サーバーが読み込むゲームのロジックが変わったときだけ
# - テスト：サーバーを守るものだけ（束ねたサーバーの読み込み・netplay-kit・変わったゲームの game-definition）
#   画面を含むゲームの全部のテストは test.yml が流す。test.yml はデプロイを止めない（個人用のリポジトリなので、CI は知らせるだけ）
# - Secret の AWS_DEPLOY_ROLE_ARN がないあいだは、デプロイを飛ばす（IAM のロールを作る前の push で失敗しないように）
# AWS への認証は OIDC で行い、アクセスキーは使わない。リポジトリは公開なので、AWS のアカウント番号はログで伏せる
name: Deploy Server

# サーバーは画面側の public/js のロジック（game.js・cpu-player.js・rules.js など）も読み込むので、ゲームの側はそこまで見る
# ただし、画面だけのファイル（main.js・ui.js・art.js・netplay/・sound/ など）は、どのゲームでもサーバーに入らないので外す
# （esbuild の metafile で、束ねた入力にこれらの名前がないことを確かめた。入り込んだら「Check bundle inputs」の手順で警告が出る）
# サーバーに変わりがなければ、sam deploy は「No changes to deploy」で終わる
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'packages/netplay-kit/server/**'
      - 'games/*/server/**'
      - 'games/*/public/js/**'
      # paths は {a,b} の書き方を使えないので、1行ずつ並べる。下の「Check bundle inputs」の手順の正規表現と同じものにする
      - '!games/*/public/js/netplay/**'
      - '!games/*/public/js/sound/**'
      - '!games/*/public/js/main.js'
      - '!games/*/public/js/online-config.js'
      - '!games/*/public/js/music.js'
      - '!games/*/public/js/game-controller.js'
      - '!games/*/public/js/ui.js'
      - '!games/*/public/js/art.js'
      - '!games/*/public/js/help.js'
      - '!games/*/public/js/animator.js'
      - '!games/*/public/js/storage.js'
      - '!games/*/public/js/board-view.js'
      - '!games/*/public/js/sound.js'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  # 最後に成功したデプロイのコミットを、gh run list で調べる
  actions: read

# デプロイを同時に2つ動かさない。動いているものは止めない（cancel-in-progress: false）
# 待てるのは1つだけで、新しい push が来ると、待っていたものは新しいものに置き換わる
# 待っていたものが動き出すときは、イベントのコミットではなく main の先端を取り出すので、いつも最新のコミットを出す
concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  # ロール web-games-cfn-deploy と、成果物の置き場所 web-games-online/ は、netplay-kit の template/github-deploy.yaml で作る
  GAME: web-games

jobs:
  # ジョブの if では secrets を読めないので、ここで Secret の有無を調べて、次のジョブに渡す
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.secret.outputs.enabled }}
    steps:
      # デプロイ用のロールの Secret があるかを調べる
      - name: Check deploy role secret
        id: secret
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE_ARN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret の AWS_DEPLOY_ROLE_ARN がないので、デプロイを飛ばします（docs/server-merge.md の IAM の手順）"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      # github.sha（イベントのコミット）ではなく、動き出した時点のブランチの先端を取り出す
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # Node.js 22 を用意する
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # 依存を入れる
      - name: Install dependencies
        run: npm ci

      # 全ゲームの chunk を一時フォルダに束ね、偽の @aws-sdk の上で handler.mjs・stats-handler.mjs を読み込んで呼ぶ
      - name: Test server bundle
        run: node --test scripts/server-bundle.test.mjs

      # chrome.test.js はヘッドレス Chrome で画面側の部品を見るもので、サーバーには関わらないので外す
      - name: Test netplay-kit
        run: npm test -w packages/netplay-kit -- --exclude test/chrome.test.js

      # 比べる元は、最後に成功したデプロイのコミット（github.event.before だと、置き換わって流れなかった push の変更を見落とす）
      # 見つからないとき（初めてのデプロイ・手で動かしたときの履歴の欠けなど）は、全ゲームを流す。全部でも2分ほど
      - name: Test game definitions of changed games
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy-server.yml --branch main --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "比べる元: $base（最後に成功したデプロイ）"
            targets=$(node scripts/changed-games.mjs "$base" | grep '^games/' || true)
          else
            echo "比べる元が見つからないので、全ゲームを流す"
            targets=$(ls -d games/*/ | sed 's|/$||')
          fi
          if [ -z "$targets" ]; then
            echo "変わったゲームはありません"
            exit 0
          fi
          failed=""
          for target in $targets; do
            echo "::group::$target"
            npm test --if-present -w "$target" -- --passWithNoTests game-definition || failed="$failed $target"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "失敗:$failed"
            exit 1
          fi

      # AWS に OIDC で認証する
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
          mask-aws-account-id: true

      # アカウント番号をログで伏せる
      - name: Mask AWS account ID
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::${account_id}"

      # AWS SAM CLI を用意する
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true

      # ゲームごとの chunk ができなかったら、ここで失敗する（scripts/build-server.mjs）
      - name: Build server
        run: npm run build:server

      # 束ねた出力には、元のファイルを示す「// games/<名前>/public/js/<ファイル>」の注記が残る
      # on.push.paths で外した画面だけのファイルが入り込んでいたら、そのファイルの変更ではデプロイが動かないので、警告する
      # （デプロイは止めない。直すのは on.push.paths のほう）
      - name: Check bundle inputs
        run: |
          leaked=$(grep -rhoE '^// games/[^/]+/(public/js/((netplay|sound)/.*|(main|online-config|music|game-controller|ui|art|help|animator|storage|board-view|sound)\.js))$' server/dist | sort -u || true)
          if [ -n "$leaked" ]; then
            echo "::warning::on.push.paths で外したファイルがサーバーに入っています。deploy-server.yml の paths を直してください:"
            echo "$leaked"
          fi

      # GitHub 用のロールにできるのは、CloudFormation 用のロール（web-games-cfn-deploy）を渡して変更セットを作ることと、
      # 成果物を共有のバケットの web-games-online/ の下に置くことだけ
      # ロールの ARN にはアカウント番号が入るので、リポジトリには書かず、ここで組み立てる（番号は前の手順でログから伏せてある）
      - name: Deploy
        working-directory: server
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          sam deploy \
            --role-arn "arn:aws:iam::${account_id}:role/${GAME}-cfn-deploy" \
            --s3-prefix "${GAME}-online" \
            --no-confirm-changeset --no-fail-on-empty-changeset
