<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#173a35">
    <title>クワークル</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="クワークル">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="defs"></div>
    <main id="app">
        <!-- タイトル画面 -->
        <section id="screen-title" class="screen title">
            <div class="title-art" id="title-art" aria-hidden="true"></div>
            <h1 class="logo">Qwirkle</h1>
            <p class="subtitle">クワークル</p>
            <div class="setup">
                <div class="setup-row"><span>人数</span>
                    <div class="segment" id="count">
                        <button data-count="2">2人</button>
                        <button data-count="3">3人</button>
                        <button data-count="4">4人</button>
                    </div>
                </div>
                <div class="setup-row"><span>CPU</span>
                    <div class="segment" id="level">
                        <button data-level="easy">やさしい</button>
                        <button data-level="normal">ふつう</button>
                    </div>
                </div>
                <div class="buttons">
                    <button id="start" class="btn primary">ゲーム開始</button>
                    <button id="resume" class="btn secondary" hidden>続きから</button>
                </div>
                <div class="title-links">
                    <button id="open-help-title" class="link">遊び方</button>
                    <button type="button" class="link bgm-toggle" aria-pressed="true">BGM</button>
                    <a class="link portal-link" href="../">← ゲーム一覧</a>
                </div>
            </div>
        </section>

        <!-- ゲーム画面 -->
        <section id="screen-game" class="screen game" hidden>
            <div class="topbar">
                <button id="home" class="icon-btn" aria-label="ホーム" title="ホーム"></button>
                <div class="scores" id="scores"></div>
                <div class="bag" id="bag" title="袋の残り"></div>
                <button type="button" class="icon-btn bgm-toggle" aria-pressed="true" aria-label="BGM" title="BGM"><svg class="line-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path class="bgm-off" d="M3 3l18 18"/></svg></button>
                <button id="open-help-game" class="icon-btn" aria-label="遊び方" title="遊び方"></button>
            </div>
            <div class="board" id="board"></div>
            <div class="status" id="status"></div>
            <div class="hand" id="hand"></div>
            <div class="actions">
                <button type="button" id="open-log" class="icon-btn" aria-label="履歴" title="履歴"></button>
                <button type="button" id="hint" class="icon-btn" aria-label="ヒント" title="おすすめの手"></button>
                <button id="undo" class="btn secondary small">戻す</button>
                <button id="trade" class="btn secondary small">交換</button>
                <button id="commit" class="btn primary small">決定</button>
            </div>
        </section>
    </main>

    <!-- シート（結果・遊び方） -->
    <div class="overlay" id="overlay" hidden>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true">
            <h2 id="sheet-title"></h2>
            <div class="sheet-body" id="sheet-body"></div>
            <div class="buttons" id="sheet-buttons"></div>
        </div>
    </div>

    <div id="drag" class="drag" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./js/music.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
