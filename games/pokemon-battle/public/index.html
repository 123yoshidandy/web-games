<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#16233a">
    <title>ポケモン6対6タクティクス</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="ポケモン6対6">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main id="app">
        <!-- タイトル画面 -->
        <section id="screen-title" class="screen title">
            <div class="title-art" aria-hidden="true"><span class="ball"></span></div>
            <h1 class="logo">ポケモン<br><small>6対6タクティクス</small></h1>
            <div class="team-preview" id="team-preview"></div>
            <div class="setup">
                <div class="setup-row"><span>CPU</span>
                    <div class="segment" id="level">
                        <button type="button" data-level="easy">やさしい</button>
                        <button type="button" data-level="normal">ふつう</button>
                        <button type="button" data-level="hard">つよい</button>
                    </div>
                </div>
                <div class="buttons">
                    <button type="button" id="start" class="btn primary">バトル開始</button>
                    <button type="button" id="resume" class="btn secondary" hidden>続きから</button>
                    <button type="button" id="open-team" class="btn secondary">編成と戦術</button>
                    <!-- オンライン対戦の接続先がないとき（デプロイ前の公開ページ）は隠す -->
                    <button type="button" id="online-button" class="btn secondary" hidden>オンラインで遊ぶ</button>
                </div>
                <div class="title-links">
                    <button type="button" id="open-help-title" class="link">遊び方</button>
                    <button type="button" class="link sound-toggle" aria-pressed="true">サウンド</button>
                    <a class="link portal-link" href="../">← ゲーム一覧</a>
                </div>
            </div>
        </section>

        <!-- 編成画面 -->
        <section id="screen-team" class="screen team-screen" hidden>
            <div class="topbar">
                <button type="button" id="team-back" class="btn secondary tiny">← 戻る</button>
                <h2>編成と戦術</h2>
                <span class="spacer"></span>
                <button type="button" id="team-reset" class="btn secondary tiny">最初の編成</button>
            </div>
            <p class="note">ポケモンを押すと、入れ替え・技・戦術ルールを決められます。ルールは上から順に見て、最初に合ったものを行います。</p>
            <div class="slots" id="slots"></div>
        </section>

        <!-- 対戦画面 -->
        <section id="screen-game" class="screen game" hidden>
            <div class="topbar">
                <div class="turn" id="turn"></div>
                <span class="spacer"></span>
                <button type="button" id="auto" class="icon-btn auto" aria-pressed="false" aria-label="オート" title="オート（戦術ルールで自動で戦う）">AUTO</button>
                <button type="button" id="open-log" class="icon-btn" aria-label="記録" title="記録"></button>
                <button type="button" class="icon-btn sound-toggle" aria-pressed="true" aria-label="サウンド" title="サウンド"><svg class="line-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/><path class="sound-off" d="M3 3l18 18"/></svg></button>
                <button type="button" id="open-help-game" class="icon-btn" aria-label="遊び方" title="遊び方"></button>
                <button type="button" id="home" class="icon-btn" aria-label="ホーム" title="ホーム"></button>
            </div>
            <div class="board-wrap">
                <div class="board" id="board"></div>
            </div>
            <div class="panel" id="panel">
                <div class="info" id="info"></div>
                <div class="dock">
                    <div class="actions" id="actions"></div>
                    <button type="button" id="hint" class="assist" aria-label="ヒント" title="おすすめの手"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg></button>
                </div>
            </div>
        </section>
    </main>

    <!-- 選択・情報のシート -->
    <div class="overlay" id="overlay" hidden>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true">
            <h2 id="sheet-title"></h2>
            <div class="sheet-body" id="sheet-body"></div>
            <div class="buttons" id="sheet-buttons"></div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./js/music.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
