<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2a1714">
    <title>フラッシュポイント</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="フラッシュポイント">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Oswald:wght@600&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main id="app">
        <!-- タイトル画面 -->
        <section id="screen-title" class="screen title">
            <div class="title-art" id="title-art" aria-hidden="true"></div>
            <h1 class="logo">FLASH POINT</h1>
            <p class="subtitle">フラッシュポイント</p>
            <div class="setup">
                <div class="setup-row"><span>人数</span>
                    <div class="segment" id="count">
                        <button type="button" data-count="2">2</button>
                        <button type="button" data-count="3">3</button>
                        <button type="button" data-count="4">4</button>
                        <button type="button" data-count="5">5</button>
                        <button type="button" data-count="6">6</button>
                    </div>
                </div>
                <div class="setup-row"><span>遊び方</span>
                    <div class="segment" id="mode">
                        <button type="button" data-mode="family">家族向け</button>
                        <button type="button" data-mode="experienced">上級</button>
                    </div>
                </div>
                <div class="setup-row" id="level-row"><span>難しさ</span>
                    <div class="segment" id="level">
                        <button type="button" data-level="recruit">新人</button>
                        <button type="button" data-level="veteran">ベテラン</button>
                        <button type="button" data-level="heroic">ヒーロー</button>
                    </div>
                </div>
                <div class="setup-row"><span>仲間</span>
                    <div class="segment" id="control">
                        <button type="button" data-control="team">CPU に任せる</button>
                        <button type="button" data-control="all">全員を操作</button>
                    </div>
                </div>
                <div class="setup-row"><span>動き</span>
                    <div id="motion-setting"></div>
                </div>
                <div class="buttons">
                    <button type="button" id="start" class="btn primary">ゲーム開始</button>
                    <button type="button" id="resume" class="btn secondary" hidden>続きから</button>
                    <!-- オンライン対戦の接続先がないとき（デプロイ前の公開ページ）は隠す -->
                    <button type="button" id="online-button" class="btn secondary" hidden>オンラインで遊ぶ</button>
                </div>
                <div class="title-links">
                    <button type="button" id="open-help-title" class="link">遊び方</button>
                    <button type="button" class="link sound-toggle" aria-pressed="true">サウンド</button>
                    <a class="link portal-link" href="../">← ゲーム一覧</a>
                </div>
            </div>
        </section>

        <!-- ゲーム画面 -->
        <section id="screen-game" class="screen game" hidden>
            <header class="topbar">
                <div class="stats">
                    <span class="stat ok" id="stat-rescued" title="助け出した人"></span>
                    <span class="stat bad" id="stat-lost" title="失った人"></span>
                    <span class="stat dmg" id="stat-damage" title="建物のダメージ"></span>
                </div>
                <div class="icons">
                    <button type="button" id="open-log" class="icon-btn" aria-label="記録" title="記録"></button>
                    <button type="button" class="icon-btn sound-toggle" aria-pressed="true" aria-label="サウンド" title="サウンド"><svg class="line-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/><path class="sound-off" d="M3 3l18 18"/></svg></button>
                    <button type="button" id="open-help-game" class="icon-btn" aria-label="遊び方" title="遊び方"></button>
                    <button type="button" id="home" class="icon-btn" aria-label="ホーム" title="ホーム"></button>
                </div>
            </header>
            <div class="board-wrap">
                <div class="board" id="board"></div>
                <div class="news" id="news" aria-live="polite"></div>
            </div>
            <div class="team" id="team"></div>
            <div class="options" id="options" hidden></div>
            <footer class="bar">
                <div class="turn-text" id="turn-text"></div>
                <button type="button" id="undo" class="icon-btn" aria-label="待った" title="待った（1手戻す）"></button>
                <button type="button" id="hint" class="icon-btn" aria-label="ヒント" title="おすすめの手"></button>
                <button type="button" id="assist" class="icon-btn" aria-label="CPU に1手任せる" title="CPU に1手任せる"></button>
                <button type="button" id="end-turn" class="btn primary small">手番を終える</button>
            </footer>
        </section>
    </main>

    <!-- 選択・情報のシート -->
    <div class="overlay" id="overlay" hidden>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true">
            <h2 id="sheet-title"></h2>
            <div class="sheet-body" id="sheet-body"></div>
            <div class="buttons" id="sheet-buttons"></div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./js/music.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
