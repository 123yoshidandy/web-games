<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f2a22">
    <title>麻雀</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="麻雀">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="symbols"></div>
    <!-- 667×375 を基準に作った舞台を、画面に合わせて拡大・縮小する（横幅が広ければ、横だけ広げる） -->
    <div id="stage" class="stage">
        <!-- タイトル画面 -->
        <section id="screen-title" class="screen title-screen">
            <div class="title-art" id="title-art" aria-hidden="true"></div>
            <h1 class="logo">麻雀</h1>
            <p class="subtitle">リーチ麻雀・4人打ち</p>
            <div class="setup">
                <div class="segment" id="length" role="radiogroup" aria-label="対局の長さ">
                    <button data-length="east" role="radio">東風戦</button>
                    <button data-length="south" role="radio">半荘戦</button>
                </div>
                <div class="buttons">
                    <button id="start" class="btn primary">対局開始</button>
                    <button id="resume" class="btn secondary" hidden>続きから</button>
                </div>
                <button id="open-help-title" class="link">遊び方</button>
            </div>
        </section>

        <!-- 対局画面 -->
        <section id="screen-game" class="screen game-screen" hidden>
            <div id="table" class="table">
                <div class="pond" data-rel="0"></div>
                <div class="pond" data-rel="1"></div>
                <div class="pond" data-rel="2"></div>
                <div class="pond" data-rel="3"></div>
                <div id="center" class="center">
                    <span class="seat-wind" data-rel="0"></span>
                    <span class="seat-wind" data-rel="1"></span>
                    <span class="seat-wind" data-rel="2"></span>
                    <span class="seat-wind" data-rel="3"></span>
                    <div class="center-info">
                        <div id="round-name" class="round-name"></div>
                        <div id="round-sub" class="round-sub"></div>
                        <div id="dora" class="dora"></div>
                        <div id="wall-count" class="wall-count"></div>
                    </div>
                </div>
                <div id="bubbles" class="bubbles"></div>
            </div>

            <div class="menu">
                <button id="home" class="icon-btn" aria-label="ホーム" title="ホーム">
                    <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>
                </button>
                <button id="open-help-game" class="icon-btn" aria-label="遊び方" title="遊び方">
                    <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17.2v.1"/></svg>
                </button>
                <button id="toggle-calls" class="icon-btn toggle" aria-label="鳴きの確認" title="鳴きの確認（オフにすると、ポン・チー・カンを聞かずに見送る）" aria-pressed="true">
                    <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16v9H10l-4.5 3.5v-3.5H4z"/><path class="slash" d="M4 20 20 4"/></svg>
                </button>
            </div>

            <div class="panel" data-rel="1"></div>
            <div class="panel" data-rel="2"></div>
            <div class="panel" data-rel="3"></div>
            <div id="mine" class="mine"></div>
            <div id="actions" class="actions"></div>
            <div id="hand" class="hand"></div>
        </section>

        <!-- 局の結果・終局 -->
        <div id="overlay-result" class="overlay" hidden>
            <div class="sheet result-sheet">
                <div id="result-body" class="sheet-body"></div>
                <div class="buttons" id="result-buttons"></div>
            </div>
        </div>

        <!-- 遊び方 -->
        <div id="overlay-help" class="overlay" hidden>
            <div class="sheet help-sheet">
                <div class="sheet-body help-body" id="help-body"></div>
                <div class="buttons"><button class="btn secondary" id="close-help">閉じる</button></div>
            </div>
        </div>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
