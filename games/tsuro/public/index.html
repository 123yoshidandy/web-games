<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#14110e">
    <title>ツォロ</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="ツォロ">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="symbols"></div>
    <main id="app">
        <!-- タイトル画面 -->
        <section id="screen-title" class="screen">
            <div class="title-art" id="title-art" aria-hidden="true"></div>
            <h1 class="logo">TSURO</h1>
            <p class="subtitle">ツォロ　道の遊び</p>
            <div class="setup">
                <div class="row"><span class="label">人数</span>
                    <div id="player-count" class="segmented" role="radiogroup" aria-label="人数">
                        <button type="button" role="radio" data-count="2">2</button>
                        <button type="button" role="radio" data-count="3">3</button>
                        <button type="button" role="radio" data-count="4">4</button>
                        <button type="button" role="radio" data-count="5">5</button>
                        <button type="button" role="radio" data-count="6">6</button>
                        <button type="button" role="radio" data-count="7">7</button>
                        <button type="button" role="radio" data-count="8">8</button>
                    </div>
                </div>
                <div class="row"><span class="label">CPU</span>
                    <div id="cpu-level" class="segmented" role="radiogroup" aria-label="CPU の強さ">
                        <button type="button" role="radio" data-level="easy">やさしい</button>
                        <button type="button" role="radio" data-level="normal">ふつう</button>
                    </div>
                </div>
                <div class="buttons">
                    <button id="start" class="btn primary">ゲーム開始</button>
                    <button id="resume" class="btn secondary" hidden>続きから</button>
                </div>
                <div class="title-links">
                    <button id="open-help-title" class="link">遊び方</button>
                    <button type="button" class="link sound-toggle" aria-pressed="true">サウンド</button>
                    <a class="link portal-link" href="../">← ゲーム一覧</a>
                </div>
            </div>
        </section>

        <!-- ゲーム画面 -->
        <section id="screen-game" class="screen" hidden>
            <header class="bar">
                <button id="home" class="icon-btn" aria-label="ホーム" title="ホーム"><svg class="ico" aria-hidden="true"><use href="#i-home"/></svg></button>
                <span id="status" class="status"></span>
                <span id="pile" class="pile" title="山の残り"></span>
                <button id="open-log" class="icon-btn" aria-label="記録" title="記録"><svg class="ico" aria-hidden="true"><use href="#i-log"/></svg></button>
                <button id="hint" class="icon-btn" aria-label="ヒント" title="ヒント"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/></svg></button>
                <button type="button" class="icon-btn sound-toggle" aria-pressed="true" aria-label="サウンド" title="サウンド"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/><path class="sound-off" d="M3 3l18 18"/></svg></button>
                <button id="open-help-game" class="icon-btn" aria-label="遊び方" title="遊び方"><svg class="ico" aria-hidden="true"><use href="#i-help"/></svg></button>
            </header>
            <div id="players" class="players"></div>
            <div class="board-wrap" id="board-wrap">
                <svg id="board" class="board" aria-label="盤"></svg>
            </div>
            <div class="hand-row">
                <div id="hand" class="hand"></div>
                <div class="controls">
                    <button id="rotate" class="act rotate" aria-label="回す" title="回す"><svg class="ico" aria-hidden="true"><use href="#i-rotate"/></svg></button>
                    <button id="confirm" class="act confirm">置く</button>
                </div>
            </div>
        </section>
    </main>

    <!-- 記録 -->
    <dialog id="log" class="sheet">
        <h2 tabindex="-1" autofocus>記録</h2>
        <ol id="log-list" class="log-list"></ol>
        <div class="buttons"><button class="btn secondary" data-close>閉じる</button></div>
    </dialog>

    <!-- 終わり -->
    <dialog id="result" class="sheet result">
        <h2 id="result-title" tabindex="-1" autofocus></h2>
        <ol id="result-list" class="result-list"></ol>
        <div class="buttons">
            <button id="again" class="btn primary">もう一度</button>
            <button id="result-board" class="btn secondary">盤を見る</button>
        </div>
    </dialog>

    <!-- 遊び方 -->
    <dialog id="help" class="sheet help">
        <h2 tabindex="-1" autofocus>遊び方</h2>
        <div class="help-body" id="help-body"></div>
        <div class="buttons"><button class="btn secondary" data-close>閉じる</button></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/music.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
