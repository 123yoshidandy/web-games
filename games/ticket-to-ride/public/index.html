<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#3b2a1e">
    <title>チケット・トゥ・ライド</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="チケット・トゥ・ライド">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Rye&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main id="app">
        <!-- タイトル画面 -->
        <section id="screen-title" class="screen">
            <div class="title-art" id="title-art" aria-hidden="true"></div>
            <h1 class="logo">Ticket to Ride</h1>
            <p class="subtitle">チケット・トゥ・ライド</p>
            <div class="setup">
                <div class="setup-row">人数
                    <div class="stepper">
                        <button id="count-down" class="step-btn" aria-label="減らす">−</button>
                        <span id="count-value" class="count-value"></span>
                        <button id="count-up" class="step-btn" aria-label="増やす">＋</button>
                    </div>
                </div>
                <div class="setup-row">CPU
                    <div class="segment" id="level">
                        <button data-level="easy">やさしい</button>
                        <button data-level="normal">ふつう</button>
                    </div>
                </div>
                <div class="buttons">
                    <button id="start" class="btn primary">ゲーム開始</button>
                    <button id="resume" class="btn secondary" hidden>続きから</button>
                </div>
                <div class="title-links">
                    <button id="open-help-title" class="link">遊び方</button>
                    <button type="button" class="link bgm-toggle" aria-pressed="true">BGM</button>
                    <a class="link portal-link" href="../">← ゲーム一覧</a>
                </div>
            </div>
        </section>

        <!-- ゲーム画面 -->
        <section id="screen-game" class="screen" hidden>
            <div class="topbar">
                <button id="home" class="icon-btn" aria-label="ホーム" title="ホーム"></button>
                <div id="players" class="players"></div>
                <button id="open-log" class="icon-btn" aria-label="記録" title="記録"></button>
                <button type="button" class="icon-btn bgm-toggle" aria-pressed="true" aria-label="BGM" title="BGM"><svg class="line-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path class="bgm-off" d="M3 3l18 18"/></svg></button>
                <button id="open-help-game" class="icon-btn" aria-label="遊び方" title="遊び方"></button>
            </div>
            <div id="map" class="map"></div>
            <div id="market" class="market"></div>
            <div id="hand" class="hand"></div>
            <div id="prompt" class="prompt"></div>
            <div id="actions" class="actions"></div>
        </section>
    </main>

    <!-- 目的地を選ぶ -->
    <dialog id="choose" class="sheet-dialog">
        <h2 id="choose-title" tabindex="-1" autofocus></h2>
        <div id="choose-list" class="ticket-list"></div>
        <div class="buttons"><button id="choose-ok" class="btn primary">残す</button></div>
    </dialog>

    <!-- 自分の目的地 -->
    <dialog id="tickets-dialog" class="sheet-dialog">
        <h2 tabindex="-1" autofocus>目的地</h2>
        <div id="tickets-list" class="ticket-list"></div>
        <div class="buttons"><button class="btn secondary close">閉じる</button></div>
    </dialog>

    <!-- 記録 -->
    <dialog id="log-dialog" class="sheet-dialog">
        <h2 tabindex="-1" autofocus>記録</h2>
        <div id="log-list" class="log-list"></div>
        <div class="buttons"><button class="btn secondary close">閉じる</button></div>
    </dialog>

    <!-- 結果 -->
    <dialog id="result" class="sheet-dialog">
        <h2 id="result-title" tabindex="-1" autofocus></h2>
        <div class="table-wrap"><table id="result-table" class="score-table"></table></div>
        <div class="buttons">
            <button id="again" class="btn primary">もう一度</button>
            <button id="result-home" class="btn secondary">ホーム</button>
        </div>
    </dialog>

    <!-- 遊び方 -->
    <dialog id="help" class="sheet-dialog help">
        <div class="help-body" id="help-body"></div>
        <div class="buttons"><button class="btn secondary close">閉じる</button></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./js/music.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
