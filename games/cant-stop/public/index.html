<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#16233a">
    <title>キャント・ストップ</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="キャントストップ">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main>
        <!-- タイトル -->
        <section id="screen-title" class="screen title-screen">
            <div class="title-art" aria-hidden="true"><svg id="title-art"></svg></div>
            <div class="title-side">
                <h1 class="logo">Can't Stop</h1>
                <p class="logo-sub">キャント・ストップ</p>
                <div class="panel">
                    <div class="row"><span class="row-label">人数</span>
                        <div id="player-count" class="segmented" role="radiogroup" aria-label="人数">
                            <button type="button" role="radio" data-count="2">2人</button>
                            <button type="button" role="radio" data-count="3">3人</button>
                            <button type="button" role="radio" data-count="4">4人</button>
                        </div>
                    </div>
                    <div class="row"><span class="row-label">CPU</span>
                        <div id="cpu-level" class="segmented" role="radiogroup" aria-label="CPU の強さ">
                            <button type="button" role="radio" data-level="easy">やさしい</button>
                            <button type="button" role="radio" data-level="normal">ふつう</button>
                        </div>
                    </div>
                    <div class="row"><span class="row-label">動き</span>
                        <div id="motion-setting"></div>
                    </div>
                    <div class="buttons">
                        <button id="start" class="primary">ゲーム開始</button>
                        <button id="resume" class="secondary" hidden>続きから</button>
                        <!-- オンライン対戦の接続先がないとき（デプロイ前の公開ページ）は隠す -->
                        <button type="button" id="online-button" class="secondary" hidden>オンラインで遊ぶ</button>
                    </div>
                    <div class="title-links">
                        <button id="open-help-title" class="link">遊び方</button>
                        <button type="button" class="link sound-toggle" aria-pressed="true">サウンド</button>
                        <a class="link portal-link" href="../">← ゲーム一覧</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- ゲーム -->
        <section id="screen-game" class="screen game-screen" hidden>
            <header class="topbar">
                <button id="home" class="icon-button" aria-label="ホーム" title="ホーム">
                    <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>
                </button>
                <div id="players" class="players"></div>
                <button type="button" class="icon-button sound-toggle" aria-pressed="true" aria-label="サウンド" title="サウンド"><svg class="line-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/><path class="sound-off" d="M3 3l18 18"/></svg></button>
                <button id="hint" type="button" class="icon-button" aria-label="ヒント" title="ヒント"><svg class="line-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg></button>
                <button id="open-help" class="icon-button" aria-label="遊び方" title="遊び方">
                    <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.8"/><path d="M12 17.2v.1"/></svg>
                </button>
            </header>

            <div class="board-wrap">
                <svg id="board" class="board" aria-label="盤面"></svg>
                <div id="banner" class="banner" aria-live="polite"></div>
            </div>

            <footer id="panel" class="action-panel">
                <div id="status-line" class="status-line"></div>
                <!-- ダイスと、続けるか止めるか -->
                <div id="dice-area" class="dice-area">
                    <div id="dice" class="dice-row"></div>
                    <div id="risk" class="risk">
                        <div class="risk-head"><span>バースト</span><b id="risk-value"></b></div>
                        <div class="risk-bar"><div id="risk-fill" class="risk-fill"></div></div>
                    </div>
                    <div class="decide-buttons">
                        <button id="stop" class="secondary">止める</button>
                        <button id="roll" class="primary">続ける</button>
                    </div>
                </div>
                <!-- ダイスの組を選ぶ -->
                <div id="pairs" class="pairs" hidden></div>
            </footer>
        </section>
    </main>

    <dialog id="help-dialog" class="dialog">
        <div class="dialog-body" tabindex="-1" autofocus>
            <div class="dialog-head"><h2>遊び方</h2><button class="icon-button close" aria-label="閉じる" data-close>
                <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
            <div id="help-content" class="help"></div>
        </div>
    </dialog>

    <dialog id="result-dialog" class="dialog">
        <div class="dialog-body" tabindex="-1" autofocus>
            <div class="dialog-head"><h2 id="result-title">結果</h2><button class="icon-button close" aria-label="盤面を見る" data-close>
                <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
            <div id="result-body" class="result-list"></div>
            <div class="buttons">
                <button id="again" class="primary">もう一度</button>
                <button id="result-home" class="secondary">ホーム</button>
            </div>
        </div>
    </dialog>

    <script type="module" src="./js/music.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
