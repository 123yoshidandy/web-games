<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#17130f">
    <title>オニタマ</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="オニタマ">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="symbols"></div>
    <main id="app">
        <!-- タイトル画面 -->
        <section id="screen-title" class="screen">
            <div class="title-art" id="title-art" aria-hidden="true"></div>
            <h1 class="logo">ONITAMA</h1>
            <p class="subtitle">オニタマ　師と弟子の兵法</p>
            <div class="setup">
                <div class="row"><span class="label">CPU</span>
                    <div id="cpu-level" class="segmented" role="radiogroup" aria-label="CPU の強さ">
                        <button type="button" role="radio" data-level="easy">やさしい</button>
                        <button type="button" role="radio" data-level="normal">ふつう</button>
                        <button type="button" role="radio" data-level="strong">つよい</button>
                    </div>
                </div>
                <div class="buttons">
                    <button id="start" class="btn primary">ゲーム開始</button>
                    <button id="resume" class="btn secondary" hidden>続きから</button>
                </div>
                <div class="title-links">
                    <button id="open-help-title" class="link">遊び方</button>
                    <button type="button" class="link bgm-toggle" aria-pressed="true">BGM</button>
                    <a class="link portal-link" href="../">← ゲーム一覧</a>
                </div>
            </div>
        </section>

        <!-- ゲーム画面 -->
        <section id="screen-game" class="screen" hidden>
            <header class="bar">
                <button id="home" class="icon-btn" aria-label="ホーム" title="ホーム"><svg class="ico" aria-hidden="true"><use href="#i-home"/></svg></button>
                <span id="status" class="status"></span>
                <button id="open-log" class="icon-btn" aria-label="記録" title="記録"><svg class="ico" aria-hidden="true"><use href="#i-log"/></svg></button>
                <button type="button" id="hint" class="icon-btn" aria-label="ヒント" title="おすすめの手"><svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg></button>
                <button type="button" class="icon-btn bgm-toggle" aria-pressed="true" aria-label="BGM" title="BGM"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path class="bgm-off" d="M3 3l18 18"/></svg></button>
                <button id="open-help-game" class="icon-btn" aria-label="遊び方" title="遊び方"><svg class="ico" aria-hidden="true"><use href="#i-help"/></svg></button>
            </header>
            <div id="row-top" class="hand-row top"></div>
            <div class="board-wrap"><div id="board" class="board" aria-label="盤"></div></div>
            <div id="row-bottom" class="hand-row bottom"></div>
        </section>
    </main>

    <!-- 記録 -->
    <dialog id="log" class="sheet">
        <h2 tabindex="-1" autofocus>記録</h2>
        <ol id="log-list" class="log-list"></ol>
        <div class="buttons"><button class="btn secondary" data-close>閉じる</button></div>
    </dialog>

    <!-- 終わり -->
    <dialog id="result" class="sheet result">
        <h2 id="result-title" tabindex="-1" autofocus></h2>
        <p id="result-text" class="result-text"></p>
        <div class="buttons">
            <button id="again" class="btn primary">もう一度</button>
            <button id="result-board" class="btn secondary">盤を見る</button>
        </div>
    </dialog>

    <!-- 遊び方 -->
    <dialog id="help" class="sheet help">
        <h2 tabindex="-1" autofocus>遊び方</h2>
        <div class="help-body" id="help-body"></div>
        <div class="buttons"><button class="btn secondary" data-close>閉じる</button></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/music.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
