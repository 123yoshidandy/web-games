<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2b0c16">
    <title>ラブレター</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="ラブレター">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main>
        <!-- タイトル -->
        <section id="screen-title" class="screen title-screen">
            <div id="title-art" class="title-art" aria-hidden="true"></div>
            <div class="title-side">
                <h1 class="logo">Love Letter</h1>
                <p class="logo-sub">ラブレター</p>
                <div class="panel">
                    <div class="row"><span class="row-label">人数</span>
                        <div id="player-count" class="segmented" role="radiogroup" aria-label="人数">
                            <button type="button" role="radio" data-count="2">2</button>
                            <button type="button" role="radio" data-count="3">3</button>
                            <button type="button" role="radio" data-count="4">4</button>
                            <button type="button" role="radio" data-count="5">5</button>
                            <button type="button" role="radio" data-count="6">6</button>
                        </div>
                    </div>
                    <div class="row"><span class="row-label">CPU</span>
                        <div id="cpu-level" class="segmented" role="radiogroup" aria-label="CPU の強さ">
                            <button type="button" role="radio" data-level="easy">やさしい</button>
                            <button type="button" role="radio" data-level="normal">ふつう</button>
                        </div>
                    </div>
                    <div class="row"><span class="row-label">動き</span>
                        <div id="motion-setting" class="motion-setting"></div>
                    </div>
                    <div class="buttons">
                        <button id="start" class="primary">ゲーム開始</button>
                        <button id="resume" class="secondary" hidden>続きから</button>
                        <!-- オンライン対戦の接続先がないとき（デプロイ前の公開ページ）は隠す -->
                        <button type="button" id="online-button" class="secondary" hidden>オンラインで遊ぶ</button>
                    </div>
                    <div class="title-links">
                        <button id="open-help-title" class="link">遊び方</button>
                        <button type="button" class="link sound-toggle" aria-pressed="true">サウンド</button>
                        <a class="link portal-link" href="../">← ゲーム一覧</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- ゲーム -->
        <section id="screen-game" class="screen game-screen" hidden>
            <header class="topbar">
                <button id="home" class="icon-button" aria-label="ホーム" title="ホーム">
                    <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>
                </button>
                <div id="round-info" class="round-info"></div>
                <button id="open-log" class="icon-button" aria-label="記録" title="記録">
                    <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
                </button>
                <button id="open-cards" class="icon-button" aria-label="カード一覧" title="カード一覧">
                    <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="11" height="15" rx="2"/><path d="M17 5.5l3 .8-3.6 13.5-3-.8"/></svg>
                </button>
                <button type="button" class="icon-button sound-toggle" aria-pressed="true" aria-label="サウンド" title="サウンド"><svg class="line-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="sound-off" d="M3 3l18 18"/></svg></button>
                <button id="open-help" class="icon-button" aria-label="遊び方" title="遊び方">
                    <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.8"/><path d="M12 17.2v.1"/></svg>
                </button>
            </header>

            <div id="opponents" class="opponents"></div>

            <div class="table-strip">
                <div id="deck-info" class="deck-info"></div>
                <div id="last-log" class="last-log"></div>
            </div>

            <div class="me-area">
                <div id="me-info" class="me-info"></div>
                <div id="hand" class="hand"></div>
                <div id="action" class="action">
                    <div id="prompt" class="prompt"></div>
                    <div id="choices" class="choices"></div>
                    <button type="button" id="hint" class="icon-button" aria-label="ヒント" title="おすすめの手"><svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg></button>
                    <button id="confirm" class="primary confirm">出す</button>
                </div>
            </div>

            <!-- 出されたカードを大きく見せる -->
            <div id="spotlight" class="spotlight" aria-live="polite"></div>
        </section>
    </main>

    <dialog id="guess-dialog" class="dialog sheet">
        <div class="dialog-body" tabindex="-1" autofocus>
            <div class="dialog-head"><h2 id="guess-title">言い当てるカード</h2><button class="icon-button close" aria-label="閉じる" data-close>
                <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
            <div id="guess-list" class="guess-list"></div>
        </div>
    </dialog>

    <dialog id="log-dialog" class="dialog">
        <div class="dialog-body" tabindex="-1" autofocus>
            <div class="dialog-head"><h2>記録</h2><button class="icon-button close" aria-label="閉じる" data-close>
                <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
            <ol id="log-list" class="log-list"></ol>
        </div>
    </dialog>

    <dialog id="cards-dialog" class="dialog">
        <div class="dialog-body" tabindex="-1" autofocus>
            <div class="dialog-head"><h2>カード一覧</h2><button class="icon-button close" aria-label="閉じる" data-close>
                <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
            <p class="dialog-note">「残り」は、あなたから見えていない枚数（山札・ほかの人の手札・除外したカード）。</p>
            <table id="cards-table" class="cards-table"></table>
        </div>
    </dialog>

    <dialog id="help-dialog" class="dialog">
        <div class="dialog-body" tabindex="-1" autofocus>
            <div class="dialog-head"><h2>遊び方</h2><button class="icon-button close" aria-label="閉じる" data-close>
                <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
            <div id="help-content" class="help"></div>
            <div id="motion-setting-help" class="motion-setting help-setting"></div>
        </div>
    </dialog>

    <dialog id="round-dialog" class="dialog">
        <div class="dialog-body" tabindex="-1" autofocus>
            <div class="dialog-head"><h2 id="round-title">ラウンドの結果</h2></div>
            <div id="round-body" class="round-body"></div>
            <div class="buttons">
                <button id="round-next" class="primary">次のラウンドへ</button>
            </div>
            <div class="buttons end-buttons">
                <button id="again" class="primary">もう一度</button>
                <button id="result-home" class="secondary">ホーム</button>
            </div>
        </div>
    </dialog>

    <script type="module" src="./js/music.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
