<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2a1f17">
    <title>コンコルディア</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="コンコルディア">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="symbols"></div>
    <main id="app">
        <!-- タイトル画面 -->
        <section id="screen-title" class="screen title-screen">
            <div class="title-art" id="title-art" aria-hidden="true"></div>
            <div class="title-side">
                <h1 class="logo">CONCORDIA</h1>
                <p class="subtitle">コンコルディア</p>
                <div class="setup">
                    <div class="row">人数
                        <div id="player-count" class="segmented" role="radiogroup" aria-label="人数">
                            <button type="button" role="radio" data-count="2">2人</button>
                            <button type="button" role="radio" data-count="3">3人</button>
                            <button type="button" role="radio" data-count="4">4人</button>
                            <button type="button" role="radio" data-count="5">5人</button>
                        </div>
                    </div>
                    <div class="row">CPU
                        <div id="cpu-level" class="segmented" role="radiogroup" aria-label="CPU の強さ">
                            <button type="button" role="radio" data-level="easy">やさしい</button>
                            <button type="button" role="radio" data-level="normal">ふつう</button>
                        </div>
                    </div>
                    <div class="buttons">
                        <button id="start" class="btn primary">ゲーム開始</button>
                        <button id="resume" class="btn secondary" hidden>続きから</button>
                    </div>
                    <button id="open-help-title" class="link">遊び方</button>
                </div>
            </div>
        </section>

        <!-- ゲーム画面 -->
        <section id="screen-game" class="screen game-screen" hidden>
            <header class="bar">
                <button id="home" class="icon-btn" aria-label="ホーム" title="ホーム"><svg class="ico" aria-hidden="true"><use href="#i-home"/></svg></button>
                <div id="players" class="players"></div>
                <button id="open-log" class="icon-btn" aria-label="記録" title="記録"><svg class="ico" aria-hidden="true"><use href="#i-log"/></svg></button>
                <button id="open-help-game" class="icon-btn" aria-label="遊び方" title="遊び方"><svg class="ico" aria-hidden="true"><use href="#i-help"/></svg></button>
            </header>
            <div class="middle">
                <div id="map" class="map"></div>
                <aside class="side">
                    <div id="market" class="market"></div>
                    <div id="store" class="store"></div>
                </aside>
            </div>
            <div class="bottom">
                <div id="status" class="status"></div>
                <div id="hand" class="hand"></div>
                <div id="actions" class="actions"></div>
            </div>
        </section>
    </main>

    <!-- 汎用の選択（カードの説明と使う・買う・商人・植民者など） -->
    <dialog id="prompt" class="sheet">
        <div id="prompt-body"></div>
    </dialog>

    <!-- ほかの人の詳しい状態 -->
    <dialog id="player-detail" class="sheet">
        <h2 id="player-detail-name" tabindex="-1" autofocus></h2>
        <div id="player-detail-body"></div>
        <div class="buttons"><button class="btn secondary" data-close>閉じる</button></div>
    </dialog>

    <!-- 記録 -->
    <dialog id="log" class="sheet">
        <h2 tabindex="-1" autofocus>記録</h2>
        <ol id="log-list" class="log-list"></ol>
        <div class="buttons"><button class="btn secondary" data-close>閉じる</button></div>
    </dialog>

    <!-- 終わり -->
    <dialog id="result" class="sheet result">
        <h2 id="result-title" tabindex="-1" autofocus></h2>
        <div id="result-body"></div>
        <div class="buttons">
            <button id="again" class="btn primary">もう一度</button>
            <button id="result-close" class="btn secondary">盤面を見る</button>
            <button id="result-home" class="btn secondary">ホーム</button>
        </div>
    </dialog>

    <!-- 遊び方 -->
    <dialog id="help" class="sheet help">
        <h2 tabindex="-1" autofocus>遊び方</h2>
        <div id="help-body" class="help-body"></div>
        <div class="buttons"><button class="btn secondary" data-close>閉じる</button></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
