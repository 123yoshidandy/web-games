<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#16302c">
    <title>スモールワールド</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="スモールワールド">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="symbols"></div>
    <main id="app">
        <!-- タイトル画面 -->
        <section id="screen-title" class="screen">
            <div class="title-art" id="title-art"></div>
            <h1 class="logo">SMALL WORLD</h1>
            <p class="subtitle">スモールワールド</p>
            <div class="setup">
                <div class="row">人数
                    <div id="player-count" class="segmented" role="radiogroup" aria-label="人数">
                        <button type="button" role="radio" data-count="2">2人</button>
                        <button type="button" role="radio" data-count="3">3人</button>
                        <button type="button" role="radio" data-count="4">4人</button>
                        <button type="button" role="radio" data-count="5">5人</button>
                    </div>
                </div>
                <div class="row">CPU
                    <div id="cpu-level" class="segmented" role="radiogroup" aria-label="CPU の強さ">
                        <button type="button" role="radio" data-level="easy">やさしい</button>
                        <button type="button" role="radio" data-level="normal">ふつう</button>
                    </div>
                </div>
                <div class="buttons">
                    <button id="start" class="btn primary">ゲーム開始</button>
                    <button id="resume" class="btn secondary" hidden>続きから</button>
                    <!-- オンライン対戦の接続先がないとき（デプロイ前の公開ページ）は隠す -->
                    <button type="button" id="online-button" class="btn secondary" hidden>オンラインで遊ぶ</button>
                </div>
                <div class="title-links">
                    <button id="open-help-title" class="link">遊び方</button>
                    <button type="button" class="link sound-toggle" aria-pressed="true">サウンド</button>
                    <a class="link portal-link" href="../">← ゲーム一覧</a>
                </div>
            </div>
        </section>

        <!-- ゲーム画面 -->
        <section id="screen-game" class="screen" hidden>
            <header class="bar">
                <button id="home" class="icon-btn" aria-label="ホーム" title="ホーム"><svg class="ico" aria-hidden="true"><use href="#i-home"/></svg></button>
                <span id="status" class="status"></span>
                <button id="open-races" class="icon-btn" aria-label="種族" title="種族"><svg class="ico" aria-hidden="true"><use href="#i-banner"/></svg></button>
                <button id="open-log" class="icon-btn" aria-label="記録" title="記録"><svg class="ico" aria-hidden="true"><use href="#i-log"/></svg></button>
                <button type="button" class="icon-btn sound-toggle" aria-pressed="true" aria-label="サウンド" title="サウンド"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/><path class="sound-off" d="M3 3l18 18"/></svg></button>
                <button id="hint" type="button" class="icon-btn" aria-label="ヒント" title="ヒント"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/></svg></button>
                <button id="open-help-game" class="icon-btn" aria-label="遊び方" title="遊び方"><svg class="ico" aria-hidden="true"><use href="#i-help"/></svg></button>
            </header>
            <div class="map-wrap">
                <div id="map" class="map"></div>
                <div class="zoom">
                    <button id="zoom-in" class="icon-btn" aria-label="拡大" title="拡大"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg></button>
                    <button id="zoom-out" class="icon-btn" aria-label="縮小" title="縮小"><svg class="ico" aria-hidden="true"><use href="#i-minus"/></svg></button>
                    <button id="zoom-fit" class="icon-btn" aria-label="全体" title="全体"><svg class="ico" aria-hidden="true"><use href="#i-fit"/></svg></button>
                </div>
            </div>
            <div class="side">
                <div id="players" class="players"></div>
                <div class="panel">
                    <div id="panel-head" class="panel-head"></div>
                    <div id="panel-info" class="panel-info"></div>
                    <div id="actions" class="actions"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- 種族と特殊能力の組 -->
    <dialog id="races" class="sheet">
        <h2 id="races-title" tabindex="-1" autofocus>種族</h2>
        <div id="races-body" class="races-body"></div>
        <div class="buttons"><button class="btn secondary" data-close>地図を見る</button></div>
    </dialog>

    <!-- 外交 -->
    <dialog id="peace" class="sheet">
        <h2 tabindex="-1" autofocus>和平を結ぶ相手</h2>
        <p class="note">選んだ人は、次の番にあなたを攻められない</p>
        <div id="peace-list" class="buttons"></div>
    </dialog>

    <!-- 記録 -->
    <dialog id="log" class="sheet">
        <h2 tabindex="-1" autofocus>記録</h2>
        <ol id="log-list" class="log-list"></ol>
        <div class="buttons"><button class="btn secondary" data-close>閉じる</button></div>
    </dialog>

    <!-- 終わり -->
    <dialog id="result" class="sheet result">
        <h2 id="result-title" tabindex="-1" autofocus></h2>
        <div id="result-table" class="score-table"></div>
        <div class="buttons">
            <button id="again" class="btn primary">もう一度</button>
            <button id="result-board" class="btn secondary">地図を見る</button>
            <button id="result-home" class="btn secondary">ホーム</button>
        </div>
    </dialog>

    <!-- 遊び方 -->
    <dialog id="help" class="sheet help">
        <h2 tabindex="-1" autofocus>遊び方</h2>
        <div class="help-body" id="help-body"></div>
        <div class="buttons"><button class="btn secondary" data-close>閉じる</button></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/music.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
