<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#123137">
    <title>世界の七不思議</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="七不思議">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main>
        <!-- タイトル -->
        <section id="screen-title" class="screen title-screen">
            <div class="title-art" aria-hidden="true"><svg id="title-art" viewBox="0 0 240 130"></svg></div>
            <div class="title-side">
                <h1 class="logo">7 Wonders</h1>
                <p class="logo-sub">世界の七不思議</p>
                <div class="panel">
                    <div class="row"><span class="row-label">人数</span>
                        <div id="player-count" class="segmented" role="radiogroup" aria-label="人数">
                            <button type="button" role="radio" data-count="3">3</button>
                            <button type="button" role="radio" data-count="4">4</button>
                            <button type="button" role="radio" data-count="5">5</button>
                            <button type="button" role="radio" data-count="6">6</button>
                            <button type="button" role="radio" data-count="7">7</button>
                        </div>
                    </div>
                    <div class="row"><span class="row-label">不思議</span>
                        <div id="wonder-side" class="segmented" role="radiogroup" aria-label="不思議の面">
                            <button type="button" role="radio" data-side="A">A面</button>
                            <button type="button" role="radio" data-side="B">B面</button>
                            <button type="button" role="radio" data-side="random">ランダム</button>
                        </div>
                    </div>
                    <div class="row"><span class="row-label">CPU</span>
                        <div id="cpu-level" class="segmented" role="radiogroup" aria-label="CPU の強さ">
                            <button type="button" role="radio" data-level="easy">やさしい</button>
                            <button type="button" role="radio" data-level="normal">ふつう</button>
                        </div>
                    </div>
                    <div class="buttons">
                        <button id="start" class="primary">ゲーム開始</button>
                        <button id="resume" class="secondary" hidden>続きから</button>
                    </div>
                    <div class="title-links">
                        <button id="open-help-title" class="link">遊び方</button>
                        <button type="button" class="link bgm-toggle" aria-pressed="true">BGM</button>
                        <a class="link portal-link" href="../">← ゲーム一覧</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- ゲーム -->
        <section id="screen-game" class="screen game-screen" hidden>
            <header class="topbar">
                <button id="home" class="icon-button" aria-label="ホーム" title="ホーム">
                    <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>
                </button>
                <div id="age-info" class="age-info"></div>
                <button id="open-cities" class="icon-button" aria-label="全員の都市" title="全員の都市">
                    <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20V10l3-2 3 2v10M13 20V6l3-2 3 2v14"/><path d="M8 13v.01M16 10v.01M16 14v.01"/></svg>
                </button>
                <button type="button" class="icon-button bgm-toggle" aria-pressed="true" aria-label="BGM" title="BGM"><svg class="line-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path class="bgm-off" d="M3 3l18 18"/></svg></button>
                <button id="hint" type="button" class="icon-button" aria-label="ヒント" title="ヒント"><svg class="line-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/></svg></button>
                <button id="open-help" class="icon-button" aria-label="遊び方" title="遊び方">
                    <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.8"/><path d="M12 17.2v.1"/></svg>
                </button>
            </header>

            <div id="neighbors" class="neighbors"></div>
            <div id="my-city" class="my-city"></div>
            <div id="hand" class="hand"></div>
            <div id="action" class="action"></div>
        </section>
    </main>

    <!-- 公開 -->
    <dialog id="reveal-dialog" class="dialog sheet">
        <div class="dialog-body" tabindex="-1" autofocus>
            <div class="dialog-head"><h2 id="reveal-title">公開</h2><button class="icon-button close" aria-label="閉じる" data-close>
                <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
            <div id="reveal-body" class="reveal-body"></div>
        </div>
    </dialog>

    <!-- 都市を見る -->
    <dialog id="cities-dialog" class="dialog">
        <div class="dialog-body" tabindex="-1" autofocus>
            <div class="dialog-head"><h2 id="cities-title">全員の都市</h2><button class="icon-button close" aria-label="閉じる" data-close>
                <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
            <div id="cities-body" class="cities-body"></div>
        </div>
    </dialog>

    <!-- 捨て札から建てる（ハリカルナッソス） -->
    <dialog id="discard-dialog" class="dialog">
        <div class="dialog-body" tabindex="-1" autofocus>
            <div class="dialog-head"><h2>捨て札から無料で建てる</h2></div>
            <div id="discard-body" class="discard-body"></div>
            <div class="buttons"><button id="discard-skip" class="secondary">建てない</button></div>
        </div>
    </dialog>

    <!-- 遊び方 -->
    <dialog id="help-dialog" class="dialog">
        <div class="dialog-body" tabindex="-1" autofocus>
            <div class="dialog-head"><h2>遊び方</h2><button class="icon-button close" aria-label="閉じる" data-close>
                <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
            <div id="help-content" class="help"></div>
        </div>
    </dialog>

    <!-- 結果 -->
    <dialog id="result-dialog" class="dialog">
        <div class="dialog-body" tabindex="-1" autofocus>
            <div class="dialog-head"><h2 id="result-title">結果</h2><button class="icon-button close" aria-label="盤面を見る" data-close>
                <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
            <div class="table-scroll"><table class="result-table"><thead><tr id="result-head"></tr></thead><tbody id="result-body"></tbody></table></div>
            <div class="buttons">
                <button id="again" class="primary">もう一度</button>
                <button id="result-home" class="secondary">ホーム</button>
            </div>
        </div>
    </dialog>

    <script type="module" src="./js/music.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
