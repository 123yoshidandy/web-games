<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1f4a45">
    <title>ウェルカム・トゥ</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="ウェルカム・トゥ">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Pacifico&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main id="app">
        <!-- タイトル画面 -->
        <section id="screen-title" class="screen">
            <div class="title-art" id="title-art" aria-hidden="true"></div>
            <h1 class="logo">Welcome To</h1>
            <p class="subtitle">ウェルカム・トゥ</p>
            <div class="setup">
                <div class="setup-row">人数
                    <div class="stepper">
                        <button id="count-down" class="step-btn" aria-label="減らす">−</button>
                        <span id="count-value" class="count-value"></span>
                        <button id="count-up" class="step-btn" aria-label="増やす">＋</button>
                    </div>
                </div>
                <div class="setup-row">CPU
                    <div class="segment" id="level">
                        <button data-level="easy">やさしい</button>
                        <button data-level="normal">ふつう</button>
                    </div>
                </div>
                <div class="buttons">
                    <button id="start" class="btn primary">ゲーム開始</button>
                    <button id="resume" class="btn secondary" hidden>続きから</button>
                </div>
                <button id="open-help-title" class="link">遊び方</button>
            </div>
        </section>

        <!-- ゲーム画面 -->
        <section id="screen-game" class="screen" hidden>
            <div class="topbar">
                <button id="home" class="icon-btn" aria-label="ホーム" title="ホーム"></button>
                <span id="turn" class="turn"></span>
                <span id="total" class="total"></span>
                <span id="others" class="others"></span>
                <button id="open-others" class="icon-btn" aria-label="ほかの人の街" title="ほかの人の街"></button>
                <button id="open-help-game" class="icon-btn" aria-label="遊び方" title="遊び方"></button>
            </div>
            <div id="cards" class="cards"></div>
            <div id="plans" class="plans"></div>
            <div id="sheet" class="sheet"></div>
            <div id="tracks" class="tracks"></div>
            <div id="prompt" class="prompt"></div>
            <div id="actions" class="actions">
                <button id="undo" class="icon-btn big" aria-label="取り消す" title="取り消す"></button>
                <div id="temp" class="temp-step" hidden>
                    <button id="temp-down" class="step-btn" aria-label="番号を減らす">−</button>
                    <span id="temp-value" class="temp-value"></span>
                    <button id="temp-up" class="step-btn" aria-label="番号を増やす">＋</button>
                </div>
                <button id="refuse" class="btn danger small" hidden>断る</button>
                <button id="end" class="btn secondary small">次へ</button>
            </div>
        </section>
    </main>

    <!-- ほかの人の街 -->
    <dialog id="others-dialog" class="sheet-dialog">
        <h2 tabindex="-1" autofocus>みんなの街</h2>
        <div id="others-list" class="others-list"></div>
        <div class="buttons"><button class="btn secondary close">閉じる</button></div>
    </dialog>

    <!-- 最初の都市計画で、切り直すか -->
    <dialog id="reshuffle" class="sheet-dialog">
        <h2 tabindex="-1" autofocus>最初の都市計画です</h2>
        <p class="dialog-text">カード81枚を切り直してもらえます。</p>
        <div class="buttons">
            <button id="reshuffle-yes" class="btn primary">切り直す</button>
            <button id="reshuffle-no" class="btn secondary">そのまま</button>
        </div>
    </dialog>

    <!-- 結果 -->
    <dialog id="result" class="sheet-dialog">
        <h2 id="result-title" tabindex="-1" autofocus></h2>
        <p id="result-reason" class="dialog-text"></p>
        <div class="table-wrap"><table id="result-table" class="score-table"></table></div>
        <div class="buttons">
            <button id="again" class="btn primary">もう一度</button>
            <button id="result-home" class="btn secondary">ホーム</button>
        </div>
    </dialog>

    <!-- 遊び方 -->
    <dialog id="help" class="sheet-dialog help">
        <div class="help-body" id="help-body"></div>
        <div class="buttons"><button class="btn secondary close">閉じる</button></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
