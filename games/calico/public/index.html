<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f6efe6">
    <title>キャリコ</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="キャリコ">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="symbols"></div>
    <main id="app">
        <!-- タイトル画面 -->
        <section id="screen-title" class="screen">
            <div class="title-art" id="title-art" aria-hidden="true"></div>
            <h1 class="logo">CALICO</h1>
            <p class="subtitle">キャリコ</p>
            <div class="setup">
                <div class="row">人数
                    <div id="player-count" class="segmented" role="radiogroup" aria-label="人数">
                        <button type="button" role="radio" data-count="1">1</button>
                        <button type="button" role="radio" data-count="2">2</button>
                        <button type="button" role="radio" data-count="3">3</button>
                        <button type="button" role="radio" data-count="4">4</button>
                    </div>
                </div>
                <div class="row" id="row-level">CPU
                    <div id="cpu-level" class="segmented" role="radiogroup" aria-label="CPU の強さ">
                        <button type="button" role="radio" data-level="easy">やさしい</button>
                        <button type="button" role="radio" data-level="normal">ふつう</button>
                    </div>
                </div>
                <div class="row">準備
                    <div id="setup-mode" class="segmented" role="radiogroup" aria-label="準備">
                        <button type="button" role="radio" data-setup="beginner">はじめて</button>
                        <button type="button" role="radio" data-setup="standard">ふつう</button>
                    </div>
                </div>
                <div class="buttons">
                    <button id="start" class="btn primary">ゲーム開始</button>
                    <button id="resume" class="btn secondary" hidden>続きから</button>
                    <!-- オンライン対戦の接続先がないとき（デプロイ前の公開ページ）は隠す -->
                    <button type="button" id="online-button" class="btn secondary" hidden>オンラインで遊ぶ</button>
                </div>
                <div class="title-links">
                    <button id="open-help-title" class="link">遊び方</button>
                    <button type="button" class="link sound-toggle" aria-pressed="true">サウンド</button>
                    <a class="link portal-link" href="../">← ゲーム一覧</a>
                </div>
            </div>
        </section>

        <!-- ゲーム画面 -->
        <section id="screen-game" class="screen" hidden>
            <header class="bar">
                <button id="home" class="icon-btn" aria-label="ホーム" title="ホーム"><svg class="ico" aria-hidden="true"><use href="#i-home"/></svg></button>
                <span id="status" class="status"></span>
                <button id="open-log" class="icon-btn" aria-label="記録" title="記録"><svg class="ico" aria-hidden="true"><use href="#i-log"/></svg></button>
                <button type="button" class="icon-btn sound-toggle" aria-pressed="true" aria-label="サウンド" title="サウンド"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/><path class="sound-off" d="M3 3l18 18"/></svg></button>
                <button id="hint" type="button" class="icon-btn" aria-label="ヒント" title="ヒント"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg></button>
                <button id="open-help-game" class="icon-btn" aria-label="遊び方" title="遊び方"><svg class="ico" aria-hidden="true"><use href="#i-help"/></svg></button>
            </header>
            <div id="players" class="players"></div>
            <button id="cats" class="cats" aria-label="猫"></button>
            <div id="board-wrap" class="board-wrap">
                <svg id="board" class="board" aria-label="キルト"></svg>
                <div id="board-label" class="board-label" hidden></div>
            </div>
            <div id="note" class="note"></div>
            <div class="tiles-row">
                <div class="tiles-group">
                    <div class="tiles-title">市場</div>
                    <div id="market" class="tiles"></div>
                </div>
                <div class="tiles-group">
                    <div class="tiles-title">手札</div>
                    <div id="hand" class="tiles"></div>
                </div>
                <button id="confirm" class="btn primary confirm" aria-label="置く" disabled><svg class="ico" aria-hidden="true"><use href="#i-check"/></svg></button>
            </div>
        </section>
    </main>

    <!-- 目標タイルを選ぶ -->
    <dialog id="goals" class="sheet">
        <h2 tabindex="-1" autofocus>目標タイルを3枚</h2>
        <div id="goals-body" class="goals-body"></div>
        <div class="buttons"><button id="goals-ok" class="btn primary" disabled>決定</button></div>
    </dialog>

    <!-- 猫 -->
    <dialog id="cats-dialog" class="sheet">
        <h2 tabindex="-1" autofocus>猫とボタン</h2>
        <div id="cats-body" class="cats-body"></div>
        <div class="buttons"><button class="btn secondary" data-close>閉じる</button></div>
    </dialog>

    <!-- 記録 -->
    <dialog id="log" class="sheet">
        <h2 tabindex="-1" autofocus>記録</h2>
        <ol id="log-list" class="log-list"></ol>
        <div class="buttons"><button class="btn secondary" data-close>閉じる</button></div>
    </dialog>

    <!-- 終わり -->
    <dialog id="result" class="sheet result">
        <h2 id="result-title" tabindex="-1" autofocus></h2>
        <div id="result-table" class="result-table"></div>
        <div class="buttons">
            <button id="again" class="btn primary">もう一度</button>
            <button id="result-close" class="btn secondary">キルトを見る</button>
        </div>
    </dialog>

    <!-- 遊び方 -->
    <dialog id="help" class="sheet help">
        <h2 tabindex="-1" autofocus>遊び方</h2>
        <div id="help-body" class="help-body"></div>
        <div class="buttons"><button class="btn secondary" data-close>閉じる</button></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/music.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
